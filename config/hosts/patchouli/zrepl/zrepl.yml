include_keys: "keys.d/*.yml"

listen:
  - addr: ":13493"
    tls_cert: "/etc/letsencrypt/live/patchouli.gensoukyou.neet.works/fullchain.pem"
    tls_key: "/etc/letsencrypt/live/patchouli.gensoukyou.neet.works/privkey.pem"
    zfs: true
    
include_jobs: "jobs.d/*.yml"

jobs:
  - name: "patchouli zroot snapshots"
    type: snap
    filesystems: {
      "zroot<": true
    }
    snapshotting:
      type: periodic
      interval: 5m
      prefix: zrepl_
      written_threshold: 1024
      timestamp_format: human
    pruning:
      keep:
        - type: regex
          negate: true
          regex: '^zrepl_'
        - type: grid
          grid: 1x4h(keep=all) | 24x1h | 7x1d
          regex: '^zrepl_'

  - name: "patchouli zroot fanout"
    type: source
    client_keys:
      - "koakuma.gensoukyou.neet.works"
      - "patchouli.gensoukyou.neet.works"
    datasets:
      - pattern: "zroot"
        recursive: true
    send:
      raw: false
      backup_properties: true
      compressed: true
      large_blocks: true
      embedded_data: true
    snapshotting:
      type: "manual"
    pruning:
      concurrency: 1

