include_keys: "keys.d/*.yml"

listen:
  - addr: "koakuma.gensoukyou.neet.works:13493"
    tls_cert: "/etc/letsencrypt/live/koakuma.gensoukyou.neet.works/fullchain.pem"
    tls_key: "/etc/letsencrypt/live/koakuma.gensoukyou.neet.works/privkey.pem"
    zfs: true
    
include_jobs: "jobs.d/*.yml"

